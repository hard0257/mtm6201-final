<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Restaurant Name -->
  <title>The Green Fork | Home</title>

  <!-- This makes sure the website works properly on phone, tablet and laptop -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- This is the font I used because it looks clean and modern -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- This is Bootstrap which helps me with layout and responsiveness -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- This is my CSS file where I style everything -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- This skip link helps people using keyboard jump directly to content -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- This is the top header of the website -->
  <header class="top-bar">

    <!-- This is the logo which links to home page -->
    <a href="index.html">
      <img src="images/logo-small.png" alt="The Green Fork logo" class="logo">
    </a>

    <!-- This is the main heading of my site -->
    <h1 class="site-title">THE GREEN FORK</h1>

    <!-- This is the main navigation menu -->
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html" class="nav-btn active">Home</a>
      <a href="menu.html" class="nav-btn">Menu</a>
      <a href="about.html" class="nav-btn">About</a>
      <a href="contact.html" class="nav-btn">Contact</a>
    </nav>

    <!-- This hamburger button appears only on mobile/tablet -->
    <button class="hamburger-btn" onclick="openMenu()">☰</button>
  </header>

  <!-- This is the mobile menu that opens when you click hamburger -->
  <div id="mobileMenu" class="mobile-menu">
    <button class="close-btn" onclick="closeMenu()">X</button>

    <a href="index.html" class="menu-link">Home</a>
    <a href="about.html" class="menu-link">About</a>
    <a href="menu.html" class="menu-link">Menu</a>
  </div>

  <!-- This is the big main image section -->
  <section class="hero">
    <picture>
      <source srcset="images/bowl-large.png" media="(min-width: 992px)">
      <source srcset="images/bowl-medium.png" media="(min-width: 600px)">
      <img src="images/bowl-small.png" alt="Healthy food bowl">
    </picture>
  </section>

  <!-- These are the small food images -->
  <section class="dish-row">
    <img src="images/soup.png" alt="soup">
    <img src="images/biryani.png" alt="biryani">
    <img src="images/vegetables.png" alt="vegetables">
  </section>

  <!-- This is just a black line for visual style -->
  <div class="full-line"></div>

  <!-- Welcome text section -->
  <section class="welcome">
    <h2 class="welcome-title">WELCOME</h2>

    <p class="welcome-text">
 Enjoy delicious and nutritious plant-based dishes made with fresh, natural ingredients in a
warm and inviting atmosphere. Step into our calm, welcoming plant-based sanctuary. 
    </p>
  </section>

  <!-- Another black line for design -->
  <div class="full-line"></div>

  <!-- This button takes user to menu page -->
  <section class="menu-button-area">
    <a href="menu.html" class="menu-btn">VIEW OUR MENU</a>
  </section>

  <!-- Footer section with social media icons -->
  <footer class="socials">
    <a href="https://www.instagram.com" target="_blank">
      <img src="images/instagram-3.png" alt="Instagram">
    </a>
    <a href="https://www.twitter.com" target="_blank">
      <img src="images/twitter-3.png" alt="Twitter">
    </a>
    <a href="https://www.youtube.com" target="_blank">
      <img src="images/youtube-3.png" alt="YouTube">
    </a>
    <a href="tel:+1234567890">
      <img src="images/phone-call-3.png" alt="Call">
    </a>
  </footer>

  <!-- This is JavaScript that opens and closes the mobile menu -->
  <script>
    function openMenu() {
      // this makes the mobile menu visible
      document.getElementById("mobileMenu").classList.add("active");
    }

    function closeMenu() {
      // this hides the mobile menu
      document.getElementById("mobileMenu").classList.remove("active");
    }
  </script>

</body>
</html>
