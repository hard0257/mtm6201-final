<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Title that shows in browser tab -->
  <title>Menu | The Green Fork</title>

  <!-- Makes site responsive on phone, tablet and desktop -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google font used for clean modern text -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap used to help with layout and spacing -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- My own custom CSS file -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Skip link for accessibility (helps keyboard users) -->
  <a href="#main" class="skip-link">Skip to main content</a>

<!-- ===== HEADER (same on all pages) ===== -->
<header class="top-bar">

  <!-- Logo that links back to home page -->
  <a href="index.html">
    <img src="images/logo-small.png" alt="The Green Fork logo" class="logo">
  </a>

  <!-- Website name -->
  <h1 class="site-title">THE GREEN FORK</h1>

  <!-- Navigation menu -->
  <nav class="main-nav" aria-label="Main navigation">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="menu.html" class="nav-btn active">Menu</a>
    <a href="about.html" class="nav-btn">About</a>
    <a href="contact.html" class="nav-btn">Contact</a>
  </nav>

  <!-- Hamburger icon for mobile menu -->
  <button class="hamburger-btn" onclick="openMenu()">☰</button>
</header>

<!-- Mobile menu that opens when hamburger is clicked -->
<div id="mobileMenu" class="mobile-menu">
  <button class="close-btn" onclick="closeMenu()">X</button>

  <a href="index.html" class="menu-link">Home</a>
  <a href="about.html" class="menu-link">About</a>
  <a href="menu.html" class="menu-link">Menu</a>
</div>

<!-- ===== MAIN CONTENT START ===== -->
<main class="container-fluid menu-page" id="main">

  <!-- Page title and subtitle -->
  <section class="text-center menu-title-section">
    <h2>Events and Catering</h2>
    <p class="menu-subtitle">Fresh, plant-based catering for every occasion</p>
  </section>

  <!-- Main image section -->
  <section class="text-center menu-image-section">
    <img 
      src="images/events-large.png"
      alt="Catering table setup"
      class="img-fluid menu-main-image"
    >
  </section>

  <!-- Decorative black divider line -->
  <div class="full-line"></div>

  <!-- Three green info boxes -->
  <section class="container menu-box-section">
    <div class="row text-center">

      <!-- Box 1 -->
      <div class="col-md-4 mb-3">
        <div class="menu-box">
          <p>Sample<br>Menu</p>
        </div>
      </div>

      <!-- Box 2 -->
      <div class="col-md-4 mb-3">
        <div class="menu-box">
          <p>Packages<br>and<br>pricing</p>
        </div>
      </div>

      <!-- Box 3 -->
      <div class="col-md-4 mb-3">
        <div class="menu-box">
          <p>Testimonials</p>
        </div>
      </div>

    </div>
  </section>

  <!-- Another decorative divider line -->
  <div class="full-line"></div>

  <div class="full-line top-line"></div>

  <!-- ===== BOOKING FORM SECTION ===== -->
  <section class="container booking-form-section">

    <!-- Form heading -->
    <h3 class="booking-title">Booking Form:-</h3>

    <!-- Form that sends user to submit page -->
    <form class="booking-form" action="submit.html" method="GET">

      <!-- Name input row -->
      <div class="form-row">
        <label for="name">Name:-</label>
        <input type="text" id="name" class="form-input">
      </div>

      <!-- Email input row -->
      <div class="form-row">
        <label for="email">Email:-</label>
        <input type="email" id="email" class="form-input">
      </div>

      <!-- Message box + submit button -->
      <div class="form-row message-row">
        <label for="message">Message:-</label>
        <textarea id="message" class="form-textarea"></textarea>

        <!-- Submit button -->
        <button type="submit" class="menu-submit-btn">SUBMIT</button>
      </div>

    </form>

  </section>

</main>

<!-- ===== FOOTER (same as other pages) ===== -->
<footer class="socials">

  <!-- Instagram icon -->
  <a href="https://www.instagram.com" target="_blank">
    <img src="images/instagram-3.png" alt="Instagram">
  </a>

  <!-- Twitter/X icon -->
  <a href="https://twitter.com" target="_blank">
    <img src="images/twitter-3.png" alt="Twitter / X">
  </a>

  <!-- YouTube icon -->
  <a href="https://youtube.com" target="_blank">
    <img src="images/youtube-3.png" alt="YouTube">
  </a>

  <!-- Phone call icon -->
  <a href="tel:+1234567890">
    <img src="images/phone-call-3.png" alt="Call us">
  </a>

</footer>

<!-- JavaScript for opening and closing mobile menu -->
<script>
function openMenu() {
  // show mobile menu
  document.getElementById("mobileMenu").classList.add("active");
}

function closeMenu() {
  // hide mobile menu
  document.getElementById("mobileMenu").classList.remove("active");
}
</script>

</body>
</html>
